<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Manager - Olaoluwa Onabowale</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-up {
            animation: slideUp 0.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Lucide Icons as SVG components
        const Upload = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
        );

        const Calendar = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
        );

        const Award = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
            </svg>
        );

        const AlertCircle = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const CheckCircle = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const Clock = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const Search = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        );

        const X = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
            </svg>
        );

        const Edit2 = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
        );

        const Trash2 = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        );

        const CertificateManager = () => {
            const [certificates, setCertificates] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterStatus, setFilterStatus] = useState('all');
            const [showUploadModal, setShowUploadModal] = useState(false);
            const [editingCert, setEditingCert] = useState(null);

            useEffect(() => {
                const stored = localStorage.getItem('certificates');
                if (stored) {
                    setCertificates(JSON.parse(stored));
                } else {
                    const initialCerts = [
                        {
                            id: 1,
                            name: 'Cisco Meraki Solutions Specialist',
                            vendor: 'Cisco',
                            issueDate: '2025-05',
                            expiryDate: '2028-05',
                            credentialId: '',
                            imageUrl: null,
                            skills: []
                        },
                        {
                            id: 2,
                            name: 'CCNA',
                            vendor: 'Cisco',
                            issueDate: '2024-07',
                            expiryDate: '2027-07',
                            credentialId: '',
                            imageUrl: null,
                            skills: ['Cisco Routers', 'Cisco Networking', 'Information Security', 'Wide Area Network (WAN)']
                        },
                        {
                            id: 3,
                            name: 'ISC2 Certified in Cybersecurity',
                            vendor: 'ISC2',
                            issueDate: '2024-03',
                            expiryDate: null,
                            credentialId: '1839769',
                            imageUrl: null,
                            skills: []
                        },
                        {
                            id: 4,
                            name: 'Microsoft Certified: Azure Fundamentals',
                            vendor: 'Microsoft',
                            issueDate: '2024-03',
                            expiryDate: null,
                            credentialId: 'F61E20D94A293C1',
                            imageUrl: null,
                            skills: []
                        },
                        {
                            id: 5,
                            name: 'Microsoft Certified: Security, Compliance, and Identity Fundamentals',
                            vendor: 'Microsoft',
                            issueDate: '2023-10',
                            expiryDate: null,
                            credentialId: '160F4C60B054747E',
                            imageUrl: null,
                            skills: []
                        }
                    ];
                    setCertificates(initialCerts);
                    localStorage.setItem('certificates', JSON.stringify(initialCerts));
                }
            }, []);

            useEffect(() => {
                if (certificates.length > 0) {
                    localStorage.setItem('certificates', JSON.stringify(certificates));
                }
            }, [certificates]);

            const getExpiryStatus = (expiryDate) => {
                if (!expiryDate) return 'no-expiry';
                
                const today = new Date();
                const expiry = new Date(expiryDate);
                const monthsUntilExpiry = (expiry - today) / (1000 * 60 * 60 * 24 * 30);
                
                if (monthsUntilExpiry < 0) return 'expired';
                if (monthsUntilExpiry < 3) return 'expiring-soon';
                if (monthsUntilExpiry < 6) return 'warning';
                return 'valid';
            };

            const getStatusConfig = (status) => {
                const configs = {
                    'expired': { 
                        color: 'bg-red-500', 
                        text: 'Expired', 
                        icon: AlertCircle,
                        borderColor: 'border-red-500',
                        textColor: 'text-red-600'
                    },
                    'expiring-soon': { 
                        color: 'bg-orange-500', 
                        text: 'Expires Soon', 
                        icon: Clock,
                        borderColor: 'border-orange-500',
                        textColor: 'text-orange-600'
                    },
                    'warning': { 
                        color: 'bg-yellow-500', 
                        text: 'Renew Soon', 
                        icon: Clock,
                        borderColor: 'border-yellow-500',
                        textColor: 'text-yellow-600'
                    },
                    'valid': { 
                        color: 'bg-green-500', 
                        text: 'Valid', 
                        icon: CheckCircle,
                        borderColor: 'border-green-500',
                        textColor: 'text-green-600'
                    },
                    'no-expiry': { 
                        color: 'bg-blue-500', 
                        text: 'No Expiry', 
                        icon: Award,
                        borderColor: 'border-blue-500',
                        textColor: 'text-blue-600'
                    }
                };
                return configs[status];
            };

            const formatDate = (dateStr) => {
                if (!dateStr) return 'N/A';
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
            };

            const handleImageUpload = (e, certId) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setCertificates(prev => prev.map(cert => 
                            cert.id === certId ? { ...cert, imageUrl: reader.result } : cert
                        ));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const addNewCertificate = (certData) => {
                const newCert = {
                    ...certData,
                    id: Date.now()
                };
                setCertificates(prev => [...prev, newCert]);
                setShowUploadModal(false);
            };

            const updateCertificate = (certData) => {
                setCertificates(prev => prev.map(cert => 
                    cert.id === certData.id ? certData : cert
                ));
                setEditingCert(null);
            };

            const deleteCertificate = (certId) => {
                if (confirm('Are you sure you want to delete this certificate?')) {
                    setCertificates(prev => prev.filter(cert => cert.id !== certId));
                }
            };

            const filteredCerts = certificates.filter(cert => {
                const matchesSearch = cert.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    cert.vendor.toLowerCase().includes(searchTerm.toLowerCase());
                const status = getExpiryStatus(cert.expiryDate);
                const matchesFilter = filterStatus === 'all' || status === filterStatus;
                return matchesSearch && matchesFilter;
            });

            const stats = {
                total: certificates.length,
                valid: certificates.filter(c => getExpiryStatus(c.expiryDate) === 'valid').length,
                warning: certificates.filter(c => ['warning', 'expiring-soon'].includes(getExpiryStatus(c.expiryDate))).length,
                expired: certificates.filter(c => getExpiryStatus(c.expiryDate) === 'expired').length
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
                    <div className="fixed inset-0 opacity-10">
                        <div className="absolute inset-0" style={{
                            backgroundImage: `
                                linear-gradient(to right, #334155 1px, transparent 1px),
                                linear-gradient(to bottom, #334155 1px, transparent 1px)
                            `,
                            backgroundSize: '60px 60px'
                        }} />
                    </div>

                    <div className="relative max-w-7xl mx-auto px-4 py-8">
                        <div className="mb-12">
                            <div className="flex items-center gap-4 mb-4">
                                <div className="w-16 h-16 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-cyan-500/30">
                                    <Award className="w-8 h-8 text-white" />
                                </div>
                                <div>
                                    <h1 className="text-5xl font-black text-white tracking-tight">
                                        Certificate Manager
                                    </h1>
                                    <p className="text-slate-400 text-lg mt-1">Track and manage your professional certifications</p>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
                                <StatCard label="Total Certs" value={stats.total} color="from-blue-500 to-blue-600" />
                                <StatCard label="Valid" value={stats.valid} color="from-green-500 to-green-600" />
                                <StatCard label="Need Attention" value={stats.warning} color="from-yellow-500 to-yellow-600" />
                                <StatCard label="Expired" value={stats.expired} color="from-red-500 to-red-600" />
                            </div>
                        </div>

                        <div className="flex flex-col md:flex-row gap-4 mb-8">
                            <div className="flex-1 relative">
                                <Search className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 w-5 h-5" />
                                <input
                                    type="text"
                                    placeholder="Search certificates..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full pl-12 pr-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all"
                                />
                            </div>
                            
                            <div className="flex gap-3">
                                <select
                                    value={filterStatus}
                                    onChange={(e) => setFilterStatus(e.target.value)}
                                    className="px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"
                                >
                                    <option value="all">All Status</option>
                                    <option value="valid">Valid</option>
                                    <option value="warning">Need Renewal</option>
                                    <option value="expiring-soon">Expiring Soon</option>
                                    <option value="expired">Expired</option>
                                    <option value="no-expiry">No Expiry</option>
                                </select>
                                
                                <button
                                    onClick={() => setShowUploadModal(true)}
                                    className="px-6 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 rounded-xl text-white font-semibold flex items-center gap-2 transition-all shadow-lg shadow-cyan-500/30 hover:shadow-cyan-500/50"
                                >
                                    <Upload className="w-5 h-5" />
                                    Add Certificate
                                </button>
                            </div>
                        </div>

                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {filteredCerts.map((cert, index) => (
                                <CertificateCard
                                    key={cert.id}
                                    cert={cert}
                                    status={getExpiryStatus(cert.expiryDate)}
                                    onImageUpload={handleImageUpload}
                                    onEdit={setEditingCert}
                                    onDelete={deleteCertificate}
                                    index={index}
                                />
                            ))}
                        </div>

                        {filteredCerts.length === 0 && (
                            <div className="text-center py-20">
                                <Award className="w-16 h-16 text-slate-600 mx-auto mb-4" />
                                <p className="text-slate-400 text-lg">No certificates found</p>
                            </div>
                        )}
                    </div>

                    {showUploadModal && (
                        <CertificateModal
                            onClose={() => setShowUploadModal(false)}
                            onSave={addNewCertificate}
                        />
                    )}

                    {editingCert && (
                        <CertificateModal
                            cert={editingCert}
                            onClose={() => setEditingCert(null)}
                            onSave={updateCertificate}
                        />
                    )}
                </div>
            );
        };

        const StatCard = ({ label, value, color }) => (
            <div className="bg-slate-800/50 backdrop-blur-sm border border-slate-700 rounded-xl p-4 hover:border-slate-600 transition-all">
                <div className={`text-3xl font-black bg-gradient-to-r ${color} bg-clip-text text-transparent mb-1`}>
                    {value}
                </div>
                <div className="text-slate-400 text-sm font-medium">{label}</div>
            </div>
        );

        const CertificateCard = ({ cert, status, onImageUpload, onEdit, onDelete, index }) => {
            const statusConfig = getStatusConfig(status);
            const StatusIcon = statusConfig.icon;

            return (
                <div 
                    className={`group bg-slate-800/50 backdrop-blur-sm border-2 ${statusConfig.borderColor} rounded-2xl overflow-hidden hover:scale-[1.02] transition-all duration-300 shadow-xl hover:shadow-2xl animate-slide-up`}
                    style={{ animationDelay: `${index * 50}ms`, opacity: 0 }}
                >
                    <div className="relative h-48 bg-gradient-to-br from-slate-700 to-slate-800 overflow-hidden">
                        {cert.imageUrl ? (
                            <img src={cert.imageUrl} alt={cert.name} className="w-full h-full object-cover" />
                        ) : (
                            <div className="w-full h-full flex items-center justify-center">
                                <Award className="w-20 h-20 text-slate-600" />
                            </div>
                        )}
                        
                        <label className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center cursor-pointer">
                            <Upload className="w-8 h-8 text-white" />
                            <input
                                type="file"
                                accept="image/*,.pdf"
                                onChange={(e) => onImageUpload(e, cert.id)}
                                className="hidden"
                            />
                        </label>

                        <div className={`absolute top-3 right-3 px-3 py-1 ${statusConfig.color} rounded-full flex items-center gap-1.5 shadow-lg`}>
                            <StatusIcon className="w-4 h-4 text-white" />
                            <span className="text-white text-xs font-bold">{statusConfig.text}</span>
                        </div>

                        <div className="absolute top-3 left-3 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button
                                onClick={() => onEdit(cert)}
                                className="p-2 bg-white/90 hover:bg-white rounded-lg transition-colors"
                            >
                                <Edit2 className="w-4 h-4 text-slate-800" />
                            </button>
                            <button
                                onClick={() => onDelete(cert.id)}
                                className="p-2 bg-red-500/90 hover:bg-red-500 rounded-lg transition-colors"
                            >
                                <Trash2 className="w-4 h-4 text-white" />
                            </button>
                        </div>
                    </div>

                    <div className="p-5">
                        <div className="flex items-start gap-3 mb-3">
                            <div className={`w-10 h-10 rounded-lg flex items-center justify-center text-white font-bold text-sm ${getVendorColor(cert.vendor)}`}>
                                {cert.vendor.substring(0, 2).toUpperCase()}
                            </div>
                            <div className="flex-1 min-w-0">
                                <h3 className="text-white font-bold text-lg leading-tight mb-1 line-clamp-2">
                                    {cert.name}
                                </h3>
                                <p className="text-slate-400 text-sm">{cert.vendor}</p>
                            </div>
                        </div>

                        <div className="space-y-2 mb-4">
                            <div className="flex items-center gap-2 text-sm">
                                <Calendar className="w-4 h-4 text-slate-500" />
                                <span className="text-slate-400">Issued:</span>
                                <span className="text-white font-semibold">{formatDate(cert.issueDate)}</span>
                            </div>
                            {cert.expiryDate && (
                                <div className="flex items-center gap-2 text-sm">
                                    <Clock className="w-4 h-4 text-slate-500" />
                                    <span className="text-slate-400">Expires:</span>
                                    <span className={`font-semibold ${statusConfig.textColor}`}>
                                        {formatDate(cert.expiryDate)}
                                    </span>
                                </div>
                            )}
                            {cert.credentialId && (
                                <div className="text-xs text-slate-500 font-mono truncate">
                                    ID: {cert.credentialId}
                                </div>
                            )}
                        </div>

                        {cert.skills && cert.skills.length > 0 && (
                            <div className="flex flex-wrap gap-1.5">
                                {cert.skills.slice(0, 3).map((skill, idx) => (
                                    <span key={idx} className="px-2 py-1 bg-slate-700/50 rounded text-xs text-slate-300">
                                        {skill}
                                    </span>
                                ))}
                                {cert.skills.length > 3 && (
                                    <span className="px-2 py-1 bg-slate-700/50 rounded text-xs text-slate-400">
                                        +{cert.skills.length - 3}
                                    </span>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const CertificateModal = ({ cert, onClose, onSave }) => {
            const [formData, setFormData] = useState(cert || {
                name: '',
                vendor: '',
                issueDate: '',
                expiryDate: '',
                credentialId: '',
                imageUrl: null,
                skills: []
            });

            const [skillInput, setSkillInput] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave(formData);
            };

            const addSkill = () => {
                if (skillInput.trim()) {
                    setFormData(prev => ({
                        ...prev,
                        skills: [...(prev.skills || []), skillInput.trim()]
                    }));
                    setSkillInput('');
                }
            };

            const removeSkill = (index) => {
                setFormData(prev => ({
                    ...prev,
                    skills: prev.skills.filter((_, i) => i !== index)
                }));
            };

            return (
                <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div className="bg-slate-800 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto border border-slate-700">
                        <div className="sticky top-0 bg-slate-800 border-b border-slate-700 p-6 flex items-center justify-between">
                            <h2 className="text-2xl font-bold text-white">
                                {cert ? 'Edit Certificate' : 'Add New Certificate'}
                            </h2>
                            <button
                                onClick={onClose}
                                className="p-2 hover:bg-slate-700 rounded-lg transition-colors"
                            >
                                <X className="w-6 h-6 text-slate-400" />
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="p-6 space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-slate-300 mb-2">
                                    Certificate Name *
                                </label>
                                <input
                                    type="text"
                                    required
                                    value={formData.name}
                                    onChange={(e) => setFormData(prev => ({ ...prev, name: e.target.value }))}
                                    className="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"
                                    placeholder="e.g., CCNA"
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-slate-300 mb-2">
                                    Vendor *
                                </label>
                                <input
                                    type="text"
                                    required
                                    value={formData.vendor}
                                    onChange={(e) => setFormData(prev => ({ ...prev, vendor: e.target.value }))}
                                    className="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"
                                    placeholder="e.g., Cisco, Microsoft, AWS"
                                />
                            </div>

                            <div className="grid md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">
                                        Issue Date *
                                    </label>
                                    <input
                                        type="month"
                                        required
                                        value={formData.issueDate}
                                        onChange={(e) => setFormData(prev => ({ ...prev, issueDate: e.target.value }))}
                                        className="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">
                                        Expiry Date
                                    </label>
                                    <input
                                        type="month"
                                        value={formData.expiryDate || ''}
                                        onChange={(e) => setFormData(prev => ({ ...prev, expiryDate: e.target.value }))}
                                        className="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-slate-300 mb-2">
                                    Credential ID
                                </label>
                                <input
                                    type="text"
                                    value={formData.credentialId || ''}
                                    onChange={(e) => setFormData(prev => ({ ...prev, credentialId: e.target.value }))}
                                    className="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"
                                    placeholder="Optional credential ID"
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-slate-300 mb-2">
                                    Skills/Tags
                                </label>
                                <div className="flex gap-2 mb-2">
                                    <input
                                        type="text"
                                        value={skillInput}
                                        onChange={(e) => setSkillInput(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && (e.preventDefault(), addSkill())}
                                        className="flex-1 px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"
                                        placeholder="Add a skill and press Enter"
                                    />
                                    <button
                                        type="button"
                                        onClick={addSkill}
                                        className="px-4 py-2 bg-cyan-600 hover:bg-cyan-700 rounded-lg text-white font-medium transition-colors"
                                    >
                                        Add
                                    </button>
                                </div>
                                <div className="flex flex-wrap gap-2">
                                    {formData.skills?.map((skill, index) => (
                                        <span key={index} className="px-3 py-1 bg-slate-700 rounded-full text-sm text-white flex items-center gap-2">
                                            {skill}
                                            <button
                                                type="button"
                                                onClick={() => removeSkill(index)}
                                                className="hover:text-red-400 transition-colors"
                                            >
                                                <X className="w-3 h-3" />
                                            </button>
                                        </span>
                                    ))}
                                </div>
                            </div>

                            <div className="flex gap-3 pt-4">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 px-6 py-3 bg-slate-700 hover:bg-slate-600 rounded-lg text-white font-semibold transition-colors"
                                >
                                    Cancel
                                </button>
                                <button
                                    type="submit"
                                    className="flex-1 px-6 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 rounded-lg text-white font-semibold transition-all shadow-lg shadow-cyan-500/30"
                                >
                                    {cert ? 'Update' : 'Add'} Certificate
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const getVendorColor = (vendor) => {
            const colors = {
                'Cisco': 'bg-blue-600',
                'Microsoft': 'bg-green-600',
                'AWS': 'bg-orange-600',
                'ISC2': 'bg-emerald-600',
                'CompTIA': 'bg-red-600',
                'Google': 'bg-yellow-600'
            };
            return colors[vendor] || 'bg-slate-600';
        };

        const getStatusConfig = (status) => {
            const configs = {
                'expired': { 
                    color: 'bg-red-500', 
                    text: 'Expired', 
                    icon: AlertCircle,
                    borderColor: 'border-red-500',
                    textColor: 'text-red-600'
                },
                'expiring-soon': { 
                    color: 'bg-orange-500', 
                    text: 'Expires Soon', 
                    icon: Clock,
                    borderColor: 'border-orange-500',
                    textColor: 'text-orange-600'
                },
                'warning': { 
                    color: 'bg-yellow-500', 
                    text: 'Renew Soon', 
                    icon: Clock,
                    borderColor: 'border-yellow-500',
                    textColor: 'text-yellow-600'
                },
                'valid': { 
                    color: 'bg-green-500', 
                    text: 'Valid', 
                    icon: CheckCircle,
                    borderColor: 'border-green-500',
                    textColor: 'text-green-600'
                },
                'no-expiry': { 
                    color: 'bg-blue-500', 
                    text: 'No Expiry', 
                    icon: Award,
                    borderColor: 'border-blue-500',
                    textColor: 'text-blue-600'
                }
            };
            return configs[status];
        };

        const formatDate = (dateStr) => {
            if (!dateStr) return 'N/A';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CertificateManager />);
    </script>
</body>
</html>
